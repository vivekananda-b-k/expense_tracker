<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Money Tracker</title>
<style>
:root{--bg:#f4f6fb;--card:#ffffff;--tx:#172033;--mu:#6b7488;--ac:#4f46e5;--onac:#ffffff;--soft:#f1f3fa;--ok:#0f9d73;--bad:#d6453d;--wn:#c47f0a;--bd:#e6e9f2;--sh:0 1px 2px rgba(23,32,51,.05),0 8px 24px rgba(23,32,51,.05);--r:16px;color-scheme:light;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1320;--card:#161d2f;--tx:#e8ecf6;--mu:#9aa5bd;--ac:#8b95ff;--onac:#10162a;--soft:#1d2540;--ok:#4cc79a;--bad:#ff7b6b;--wn:#f0b44c;--bd:#263049;--sh:none;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1320;--card:#161d2f;--tx:#e8ecf6;--mu:#9aa5bd;--ac:#8b95ff;--onac:#10162a;--soft:#1d2540;--ok:#4cc79a;--bad:#ff7b6b;--wn:#f0b44c;--bd:#263049;--sh:none;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:130px}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 Inter,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
small,.mu{color:var(--mu)}.pos{color:var(--ok)}.neg{color:var(--bad)}.wn{color:var(--wn)}
.scrim{position:fixed;inset:0;background:rgba(10,15,30,.45);opacity:0;pointer-events:none;transition:opacity .2s;z-index:25}.scrim.on{opacity:1;pointer-events:auto}
.menu{position:fixed;inset:0 auto 0 0;width:272px;background:var(--card);border-right:1px solid var(--bd);transform:translateX(-102%);transition:transform .22s ease;z-index:30;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.menu.open{transform:none;box-shadow:var(--sh)}
.mh{display:flex;justify-content:space-between;align-items:center;padding:18px 16px 8px;font-weight:700;font-size:17px}
#nav{flex:1;overflow:auto;padding:4px 10px}
.mg{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mu);padding:14px 10px 6px}
.ni{display:flex;gap:12px;align-items:center;width:100%;border:0;background:none;color:var(--tx);padding:10px 12px;border-radius:12px;font:inherit;cursor:pointer;text-align:left}
.ni span{width:22px;text-align:center}.ni:hover{background:var(--soft)}.ni.on{background:var(--soft);color:var(--ac);font-weight:600}
.mf{display:flex;flex-direction:column;gap:8px;padding:12px;border-top:1px solid var(--bd);padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
.main{min-height:100vh}
.hd{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;background:var(--bg);border-bottom:1px solid var(--bd)}
.ht{flex:1;min-width:0}.ht h1{font-size:18px;margin:0;line-height:1.25;font-weight:700}
.ht small{display:block;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hs{display:flex;gap:8px}
.ib{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:12px;min-width:40px;height:40px;padding:0 10px;font:inherit;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.ib.pri{background:var(--ac);border-color:var(--ac);color:var(--onac)}.ib i{font-style:normal;font-size:13px;font-weight:600;display:none}
@media (min-width:560px){.ib i{display:inline}}
.ms{display:none;position:sticky;top:calc(62px + env(safe-area-inset-top,0px));z-index:9;gap:8px;justify-content:center;align-items:center;padding:8px 12px;background:var(--bg)}
.ms select{width:auto;min-width:92px;padding:8px 10px}
.pg{max-width:880px;margin:0 auto;padding:14px 14px 60px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:16px;margin-bottom:14px;box-shadow:var(--sh)}
.c h2{font-size:14px;margin:0 0 12px;font-weight:650}
.em{text-align:center;padding:28px 16px}.em b{font-size:16px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.k{background:var(--soft);border-radius:14px;padding:12px 14px;font-size:12.5px;color:var(--mu)}
.k b{display:block;font-size:19px;font-weight:700;color:var(--tx);margin-top:2px;letter-spacing:-.2px}
.k small{display:block;margin-top:2px;font-size:11.5px}
.k b.pos{color:var(--ok)}.k b.neg{color:var(--bad)}.k b.wn{color:var(--wn)}
.r{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--bd)}.r:last-child{border:0}
label{display:block;font-size:12px;color:var(--mu);margin:0 0 5px;font-weight:500}
input,select{width:100%;padding:11px 12px;border:1px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);font:inherit}
input:focus,select:focus{outline:2px solid var(--ac);outline-offset:1px;border-color:var(--ac)}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
.b{background:var(--ac);color:var(--onac);border:1px solid var(--ac);border-radius:12px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer}
.b.ghost{background:transparent;color:var(--tx);border-color:var(--bd)}.b.sm{padding:7px 12px;font-size:13px}.b:active{transform:scale(.98)}
.x{background:none;border:0;color:var(--bad);cursor:pointer;font-size:18px;padding:2px 6px}
.act{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.fold{margin-bottom:14px}.fold>summary{cursor:pointer;padding:12px 16px;background:var(--card);border:1px solid var(--bd);border-radius:var(--r);font-weight:600;box-shadow:var(--sh)}.fold[open]>summary{margin-bottom:10px}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--ok);border-radius:6px}
td,th{padding:6px 5px;text-align:right;border-bottom:1px solid var(--bd)}th:first-child,td:first-child{text-align:left}th{color:var(--mu);font-weight:500;font-size:12px}
details summary{cursor:pointer}
.ir{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:nowrap}.ir .nm{flex:1 1 0;min-width:0}.ir .am{flex:0 0 112px;width:112px;min-width:0}.ir .x{flex:0 0 34px;padding:0;text-align:center}@media (min-width:560px){.ir .am{flex-basis:170px;width:170px}}
.b.sm{white-space:nowrap}.pdfbtn{background:var(--soft);color:var(--tx);border:1px solid var(--bd);border-radius:9px;padding:6px 9px;font:inherit;font-size:12px;cursor:pointer;white-space:nowrap}.fp{padding-bottom:84px}.fbar{position:fixed;left:0;right:0;bottom:0;display:flex;gap:10px;justify-content:flex-end;padding:12px 14px calc(12px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--bd);z-index:12}.fbar .b{min-width:120px}
@media (min-width:1000px){.menu{transform:none;box-shadow:none}.main{margin-left:272px}.scrim{display:none}#hb{display:none}body.fm #hb{display:inline-flex}.fbar{left:272px}}

/* This Month: compact entry-first layout */
.month-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:0 0 12px}
.month-kpi{min-width:0;padding:11px 12px;background:var(--card);border:1px solid var(--bd);border-radius:13px}
.month-kpi span{display:block;color:var(--mu);font-size:11px;line-height:1.3}
.month-kpi b{display:block;margin-top:4px;font-size:clamp(14px,2.1vw,19px);letter-spacing:-.3px;overflow-wrap:anywhere}
.month-entry{padding:13px 14px;margin-bottom:10px}
.month-entry h2{margin:0;font-size:14px}
.month-sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:9px}
.month-sec-head .mu{font-size:11px;text-align:right}
.month-line{display:flex;align-items:center;gap:8px;margin:0 0 7px;min-width:0}
.month-line input{min-width:0;padding:9px 10px;border-radius:10px;font-size:14px}
.income-line .nm{flex:1 1 auto;width:40%}.income-line .am{flex:0 0 34%;width:34%}
.income-line .x{flex:0 0 28px;width:28px}
.bill-line .month-name{flex:1 1 auto;min-width:0;font-size:13px;font-weight:550}
.bill-line input{flex:0 0 46%;width:46%}
.month-invest-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px 12px}
.month-invest-grid>div{min-width:0}.month-invest-grid label{font-size:11px;margin-bottom:4px}
.month-invest-grid input,.month-invest-grid select{padding:8px 9px;font-size:13px;border-radius:9px}
.month-empty{font-size:12px;margin:2px 0 10px}
.month-result{padding:14px}.month-result h2{margin-bottom:8px}
.month-result .r{padding:8px 0;font-size:13px}
@media(max-width:430px){.month-kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.month-kpi{padding:9px 10px}.month-invest-grid{grid-template-columns:1fr}.month-entry{padding:12px}.income-line .am{flex-basis:38%;width:38%}.bill-line input{flex-basis:48%;width:48%}}
.month-bill-status{margin-top:14px;padding-top:12px;border-top:1px solid var(--bd)}.month-bill-status h3{font-size:15px;margin:0}</style></head><body>
<div class="scrim" id="scrim" onclick="menu(false)"></div>
<aside class="menu" id="menu"><div class="mh"><span>💰 Money Tracker</span><button class="ib" onclick="menu(false)">✕</button></div><nav id="nav"></nav>
<div class="mf"><button class="b ghost sm" onclick="exp()">⬇ Export backup</button><label class="b ghost sm" style="cursor:pointer;margin:0;text-align:center">⬆ Import backup<input type="file" accept=".json" style="display:none" onchange="imp(this)"></label><button class="b ghost sm" onclick="lockNow();menu(false)">🔒 Lock sync</button></div></aside>
<div class="main"><header class="hd"><button class="ib" id="hb" onclick="hbClick()">☰</button><div class="ht"><h1 id="ttl">Overview</h1><small id="st">Loading…</small></div><div class="hs"><button class="ib" onclick="refreshNow()" title="Refresh from the Sheet">🔄<i>Refresh</i></button><button class="ib pri" onclick="saveNow()" title="Save to the Sheet">💾<i>Save</i></button></div></header>
<div class="ms" id="mstrip"><button class="ib" onclick="mv(-1)">◀</button><select id="ms"></select><select id="ys"></select><button class="ib" onclick="mv(1)">▶</button></div>
<main id="v" class="pg"></main></div>
<script>
const CATS=["Rent / housing","Groceries","Utilities & bills","Transport / fuel","Dining & shopping","Health & insurance","School fees / education","Subscriptions","Other"];
const INV=["FD","RD","Mutual Fund","Stock","PPF","EPF","NPS","Gold"];
const TABS={home:"Overview",month:"This month",cards:"Credit cards",wealth:"Investments",loans:"Loans",gold:"Gold, silver & property",bank:"Bank accounts",events:"Events",sync:"Google Sheet"};
let S={m:{},b:[],cb:0,cards:[],bills:{},inv:[],loans:[],gold:[],prop:[],gr:"",sr:"",ll:{},banks:[],bk:{},events:[]},cur=new Date().toISOString().slice(0,7),tab="month",ref=null,tm;
const $=q=>document.querySelector(q),num=v=>parseFloat(v)||0;
const fm=n=>(n<0?"-":"")+"₹"+Math.abs(Math.round(n||0)).toLocaleString("en-IN");
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function node(p){let t,r;const a=p.split(".");if(a[0]=="m"){t=S.m[cur]??={};r=a.slice(1)}else if(a[0]=="bill"){t=S.bills[cur]??={};r=a.slice(1)}else{t=S;r=a}
return{t,r}}
function get(p){let{t,r}=node(p);for(const k of r){if(t==null)return"";t=t[k]}return t??""}
function put(p,v){let{t,r}=node(p);r.forEach((k,i)=>{if(i==r.length-1)t[k]=v;else t=t[k]??=(isNaN(r[i+1])?{}:[])})}
function mt(k){const x=S.m[k]||{},inc=(x.inc||[]).reduce((a,r)=>a+num(r.a),0),emi=S.loans.reduce((a,l)=>{const o=lrow(l,k);return a+(o?o.emi+o.x:0)},0),inv=S.inv.reduce((a,z)=>a+invAmt(x,z,k),0),cc=S.cards.reduce((a,c)=>a+num(((S.bills[k]||{})[c.id]||{}).s),0);
return{inc,e:cc,cat:0,emi,inv,cc,sur:inc-cc-emi-inv,saved:inc-cc-emi,rate:inc?(inc-cc-emi)/inc:0}}
function nxt(d){const n=new Date(),t0=new Date(n.getFullYear(),n.getMonth(),n.getDate());let t=new Date(n.getFullYear(),n.getMonth(),d);if(t<t0)t=new Date(n.getFullYear(),n.getMonth()+1,d);return{t,days:Math.round((t-t0)/864e5)}}
const dt=t=>t.toLocaleDateString("en-IN",{day:"numeric",month:"short"});
function inp(p,l,type="number",ph="0"){return`<div><label>${l}</label><input data-p="${p}" type="${type}" inputmode="${type=="number"?"decimal":"text"}" placeholder="${ph}" value="${esc(get(p))}"></div>`}
const row=(a,b,c="")=>`<div class="r"><span>${a}</span><b class="${c}">${b}</b></div>`;
function incBlock(){const r=(S.m[cur]||{}).inc||[],ns=[...new Set(Object.values(S.m).flatMap(x=>(x.inc||[]).map(i=>i.n)).filter(Boolean))];
return`<section class="c month-entry"><div class="month-sec-head"><h2>Income</h2><span class="mu">By family member / source</span></div><datalist id="nm">${ns.map(n=>`<option value="${esc(n)}">`).join("")}</datalist>${r.map((x,i)=>`<div class="month-line income-line"><input class="nm" list="nm" data-p="m.inc.${i}.n" value="${esc(x.n)}" placeholder="Name / source" aria-label="Income source"><input class="am" data-p="m.inc.${i}.a" type="number" inputmode="decimal" placeholder="Amount ₹" value="${esc(x.a)}" aria-label="Income amount"><button class="x" onclick="delInc(${i})" aria-label="Remove income">×</button></div>`).join("")||'<p class="mu month-empty">No income entries yet.</p>'}<button class="b sm ghost" onclick="addInc()">＋ Add income</button></section>`}
function spendBlock(){const none=t=>`<p class="mu month-empty">${t}</p>`;
return`<section class="c month-entry"><div class="month-sec-head"><h2>Credit card bills</h2><span class="mu">Statement amount · ₹</span></div>${S.cards.map(c=>`<div class="month-line bill-line"><span class="month-name">${esc(c.name)}</span><input data-p="bill.${c.id}.s" type="number" inputmode="decimal" placeholder="Statement amount ₹" value="${esc(get("bill."+c.id+".s"))}" aria-label="${esc(c.name)} statement bill"></div>`).join("")||none("Add a card in the Credit cards tab first.")}${billsBlock()}</section><section class="c month-entry"><div class="month-sec-head"><h2>Investments this month</h2><span class="mu">SIPs fill in automatically</span></div><div class="month-invest-grid">${invRows()}</div></section>`}
function goldVal(){return S.gold.reduce((a,x)=>a+gv1(x),0)}
function gv1(x){const k=num(x.k)||24;return k>100?num(x.g)*k/999*num(S.sr):num(x.g)*k/24*num(S.gr)}
const pl=x=>{const k=num(x.k)||24;return k>100?"Silver "+k:k+"K"};
const bar1=(n,a,b)=>{const p=b?Math.min(100,a/b*100):0,o=a>b&&b;return`<div class="r" style="display:block"><div style="display:flex;justify-content:space-between"><span>${n}</span><b class="${o?"neg":""}">${fm(a)} / ${fm(b)}</b></div><div class="bar"><i style="width:${p}%;background:${o?"var(--bad)":"var(--ok)"}"></i></div></div>`};
const pmt=(P,i,k)=>k<=0?P:(i?P*i/(1-Math.pow(1+i,-k)):P/k);
function invRows(){const x=S.m[cur]||{},sh=x.sh||[];if(!S.inv.length)return'<p class="mu">Add investments in the Investments tab first.</p>';
const shown=S.inv.filter(z=>(z.mode=="Monthly SIP"&&(!z.sm||cur>=z.sm))||num((x.iv||{})[z.id])!=0||sh.includes(z.id)),rest=S.inv.filter(z=>!shown.includes(z));
return shown.map(z=>`<div><label>${esc(z.t+" · "+z.name)}</label><input data-p="m.iv.${z.id}" type="number" inputmode="decimal" placeholder="${z.mode=="Monthly SIP"?num(z.sip):"0"}" value="${esc(get("m.iv."+z.id))}"><select data-p="m.ia.${z.id}" aria-label="Paid from account" style="margin-top:6px;font-size:13px">${accOpts(get("m.ia."+z.id)||z.acct||"")}</select></div>`).join("")+(rest.length?`<div><label>Other investment this month</label><select id="addiv" onchange="showInv()"><option value="">+ Add another…</option>${rest.map(z=>`<option value="${z.id}">${esc(z.t+" · "+z.name)}</option>`).join("")}</select></div>`:"")}
function showInv(){const id=v("addiv");if(!id)return;const m=S.m[cur]??={};(m.sh??=[]).push(id);save();render()}
function dyeHtml(a,r,y,io){const i=r/1200,n=Math.round(y*12);if(!a||n<=io||io<0)return'<p class="mu">Check the amount, tenure and interest-only months.</p>';
const reg=pmt(a,i,n),ip=a*i,post=pmt(a,i,n-io),totD=ip*io+post*(n-io),totR=reg*n;
return`<div class="g" style="margin:8px 0"><div class="k">Interest-only payment<b>${fm(ip)}</b><small>for ${io} months</small></div><div class="k">EMI after that<b>${fm(post)}</b><small>for ${n-io} months</small></div><div class="k">Regular EMI, no plan<b>${fm(reg)}</b></div></div>`+row("Total interest with Design Your EMI",fm(totD-a))+row("Total interest with a regular EMI",fm(totR-a))+row("Extra interest from the plan",fm(totD-totR),"neg")+row("EMI increase after interest-only period",fm(post-reg))}
function dye(){const mx=v("dt")=="U"?48:12;$("#dyo").innerHTML=dyeHtml(num(v("da")),num(v("dr")),num(v("dy")),Math.min(num(v("dm")),mx))}
function dyeCard(){return`<div class="c"><h2>Design Your EMI calculator (Godrej Housing Finance)</h2><div class="f"><div><label>Loan amount (₹)</label><input id="da" type="number" value="8000000" oninput="dye()"></div><div><label>Interest rate % (use your sanctioned rate)</label><input id="dr" type="number" step="0.01" value="7.65" oninput="dye()"></div><div><label>Tenure (years)</label><input id="dy" type="number" value="20" oninput="dye()"></div><div><label>Property</label><select id="dt" onchange="dye()"><option value="R">Ready to move in (up to 12 months)</option><option value="U">Under construction (up to 48 months)</option></select></div><div><label>Interest-only months</label><input id="dm" type="number" value="12" oninput="dye()"></div></div><div id="dyo">${dyeHtml(8000000,7.65,20,12)}</div><p><button class="b" onclick="fillLoan()">Use these details for my home loan</button></p><small class="mu">Based on Godrej Housing Finance’s published terms: interest-only payments for up to 12 months on ready homes and up to 48 months on under-construction homes, with 7.65% as the advertised starting rate. Your actual rate is confirmed at sanction, and the interest amount you can choose in the flexible period sits within limits Godrej sets, so check your sanction letter. After the interest-only period the EMI is recalculated over the remaining tenure.</small></div>`}
const ym=k=>{const[a,b]=k.split("-").map(Number);return a*12+b-1},ymk=n=>Math.floor(n/12)+"-"+String(n%12+1).padStart(2,"0");
function demiCalculation(l){
 const annual=num(l.r),N=Math.round(num(l.n)),r=annual/1200,cap=l.propertyType==="UNDER_CONSTRUCTION"?48:12,errors=[],schedule=[];
 const draws=(l.tr||[]).filter(z=>num(z.a)>0&&z.d).map(z=>({m:z.d.slice(0,7),day:+z.d.slice(8,10)||1,a:num(z.a)})).sort((a,b)=>a.m<b.m?-1:a.m>b.m?1:a.day-b.day);
 const staged=draws.length>0,openingInput=Math.max(0,num(l.bal0)),P=staged?openingInput+draws.reduce((a,z)=>a+z.a,0):(openingInput||num(l.p));
 const start=l.ef||l.from||(draws[0]&&draws[0].m)||cur;
 const initial=openingInput+draws.filter(z=>z.m<start).reduce((a,z)=>a+z.a,0);
 const legacy=Array.isArray(l.demiPeriods)&&l.demiPeriods.length&&!Number.isFinite(+l.demiMonths);
 const demiMonths=legacy?l.demiPeriods.reduce((a,x)=>a+Math.max(0,Math.round(num(x.durationMonths))),0):Math.round(num(l.demiMonths));
 const demiPayment=legacy?null:num(l.demiPayment),fPay=Array.isArray(l.fPayPeriods)?l.fPayPeriods:[];
 const fPayMonths=fPay.reduce((a,x)=>a+Math.max(0,Math.round(num(x.durationMonths))),0);
 if(!(P>0))errors.push("Enter a valid opening/disbursed principal amount or add dated disbursements.");
 if(!(annual>=0))errors.push("Interest rate must be zero or greater.");
 if(!(N>0)||!Number.isInteger(num(l.n)))errors.push("Enter a valid whole-number total tenure in months.");
 if(legacy){if(!l.demiPeriods.length)errors.push("Add at least one DEMI phase.");if(demiMonths>cap)errors.push("DEMI duration exceeds the "+cap+"-month cap for this property type.");l.demiPeriods.forEach((x,i)=>{if(!Number.isInteger(+x.durationMonths)||num(x.durationMonths)<=0)errors.push("DEMI phase "+(i+1)+" duration must be a positive whole number.");if(!Number.isFinite(+x.customMonthlyPayment)||num(x.customMonthlyPayment)<0)errors.push("DEMI phase "+(i+1)+" payment must be non-negative.")})}
 else {if(!(demiMonths>0)||!Number.isInteger(num(l.demiMonths)))errors.push("Enter DEMI duration as a positive whole number of months.");if(demiMonths>cap)errors.push("DEMI duration exceeds the "+cap+"-month cap for this property type.");if(!Number.isFinite(demiPayment)||demiPayment<0)errors.push("Enter a valid non-negative DEMI monthly payment.")}

for mutual funds and stocks" style="width:100%;min-width:320px;height:auto;display:block">${ticks}<path d="${path}" fill="none" stroke="var(--ok)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>${dots}${labels}</svg><div class="mu" style="font-size:12px;margin:8px 0 2px">Monthly contributions (₹)</div><svg viewBox="0 0 ${W} 112" role="img" aria-label="Monthly contributions chart" style="width:100%;min-width:320px;height:auto;display:block"><line x1="${L}" y1="72" x2="${W-R}" y2="72" stroke="var(--bd)"/>${bars}${labels.replaceAll(`y="${H-12}"`,`y="105"`)}</svg></div><div class="g" style="margin-top:8px"><div class="k">Current market value<b>${fm(list.reduce((a,{x})=>a+curVal(x),0))}</b></div><div class="k">Total invested<b>${fm(list.reduce((a,{x})=>a+costOf(x),0))}</b></div><div class="k">Current gain / loss<b class="${list.reduce((a,{x})=>a+curVal(x)-costOf(x),0)>=0?'pos':'neg'}">${fm(list.reduce((a,{x})=>a+curVal(x)-costOf(x),0))}</b></div></div><small class="mu">Charts use existing monthly investment entries and saved holding values. Historical line is cumulative invested capital, not historical market value or investment return. Current market value and gain/loss use the app's latest saved values.</small>`}


function setInvHistoryMode(mode){(S.ui??={}).invHistoryMode=mode;save();render()}
function individualInvestmentHistory(onlyItem){
 if(onlyItem&&!(["Mutual Fund","Stock"].includes(onlyItem.t)))return "";
 const items=onlyItem?[{x:onlyItem}]:S.inv.map((x,i)=>({x,i})).filter(({x})=>["Mutual Fund","Stock"].includes(x.t));
 if(!items.length)return "";
 const mode=(S.ui||{}).invHistoryMode||"monthly";
 const html=items.map(({x,i})=>{
  const raw=Object.keys(S.invHistory||{}).sort().map(k=>({k,v:S.invHistory[k]?.[x.id]})).filter(o=>o.v);
  const pts=raw.map(o=>({k:o.k,value:num(o.v.value),invested:num(o.v.invested)}));
  let shown=pts;
  if(mode==="yearly") {const by={};pts.forEach(p=>by[p.k.slice(0,4)]=p);shown=Object.values(by)}
  const W=640,H=205,L=68,R=16,T=16,B=36,vals=shown.map(p=>p.value),lo=Math.min(0,...vals),hi=Math.max(1,...vals),rg=Math.max(1,hi-lo),xx=j=>L+(W-L-R)*(shown.length<2?0:j/(shown.length-1)),yy=v=>T+(H-T-B)*(1-(v-lo)/rg);
  const grid=[0,.5,1].map(f=>{const v=lo+rg*f,y=yy(v);return `<line x1="${L}" y1="${y}" x2="${W-R}" y2="${y}" stroke="var(--bd)"/><text x="${L-7}" y="${y+4}" text-anchor="end" fill="var(--mu)" font-size="10">${(v/100000).toFixed(1)}L</text>`}).join("");
  const path=shown.map((p,j)=>(j?"L":"M")+xx(j)+","+yy(p.value)).join(" ");
  const dots=shown.map((p,j)=>`<circle cx="${xx(j)}" cy="${yy(p.value)}" r="3.5" fill="var(--ok)"><title>${p.k} · Value ${fm(p.value)} · Invested ${fm(p.invested)}</title></circle>`).join("");
  const labels=shown.map((p,j)=>j===0||j===shown.length-1||j%Math.max(1,Math.ceil(shown.length/6))===0?`<text x="${xx(j)}" y="${H-10}" text-anchor="middle" fill="var(--mu)" font-size="10">${esc(mode==="yearly"?p.k:p.k.slice(2))}</text>`:"").join("");
  const rows=pts.slice().reverse().map(p=>`<div class="r"><span>${esc(p.k)}<br><small class="mu">Invested ${fm(p.invested)}</small></span><span style="text-align:right"><b>${fm(p.value)}</b><br><small class="${p.value-p.invested>=0?'pos':'neg'}">${fm(p.value-p.invested)} gain/loss</small></span></div>`).join("");
  const latest=pts[pts.length-1],gain=latest?latest.value-latest.invested:0;
  return `<details class="c" open><summary style="cursor:pointer;font-weight:700">${esc(x.t)} · ${esc(x.name)} <small class="mu">${pts.length} saved month(s)</small></summary><div class="g" style="margin-top:10px"><div class="k">Latest value<b>${fm(latest?.value||curVal(x))}</b></div><div class="k">Invested<b>${fm(latest?.invested||costOf(x))}</b></div><div class="k">Gain / loss<b class="${gain>=0?'pos':'neg'}">${fm(gain)}</b></div></div>${shown.length?`<div style="overflow-x:auto;margin-top:10px"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(x.name)} historical value" style="width:100%;min-width:300px;height:auto;display:block">${grid}<path d="${path}" fill="none" stroke="var(--ok)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>${dots}${labels}</svg></div>`:'<p class="mu">No saved monthly snapshots yet. Your next save will start this investment history.</p>'}<details><summary>Show all monthly entries (${pts.length})</summary>${rows||'<p class="mu">No entries yet.</p>'}</details></details>`;
 }).join("");
 if(onlyItem)return html;
 return `<div class="c"><div class="r"><h2 style="margin:0">Individual investment history</h2><select aria-label="History chart period" style="width:auto" onchange="setInvHistoryMode(this.value)"><option value="monthly" ${mode==="monthly"?'selected':''}>Monthly</option><option value="yearly" ${mode==="yearly"?'selected':''}>Yearly</option></select></div><small class="mu">Each mutual fund and stock is stored as its own month-end record. Values are snapshots from the data entered in the app; no historical prices are invented.</small></div>${html}`;
}


function assets(){const L=[],by={};S.inv.forEach(x=>{by[x.t]=(by[x.t]||0)+curVal(x)});INV.forEach(t=>{if(by[t])L.push([t,by[t]])});Object.keys(by).forEach(t=>{if(!INV.includes(t)&&by[t])L.push([t,by[t]])});const gv=goldVal(),pv=S.prop.reduce((a,x)=>a+num(x.val),0);const ms=metalStats();if(ms.gv)L.push(["Gold ("+ms.gg+" g)",ms.gv]);if(ms.sv)L.push(["Silver ("+ms.sg+" g)",ms.sv]);if(pv)L.push(["Property",pv]);const bb=bankTot(cur);if(bb)L.push(["Bank balances",bb]);return L}
function yearTable(){const y=cur.slice(0,4);let rows="",ti=0,te=0,ts=0;for(let m=1;m<=12;m++){const k=y+"-"+String(m).padStart(2,"0");if(!S.m[k])continue;const t=mt(k);ti+=t.inc;te+=t.e;ts+=t.saved;rows+=`<div class="r" style="cursor:pointer" onclick="setM(${y},${m})"><span>${MN[m-1]}</span><span>${fm(t.inc)} · ${fm(t.e)} · <b class="${t.saved<0?"neg":"pos"}">${fm(t.saved)}</b></span></div>`}
return`<div class="c"><h2>${y}, month by month <small>(income · spend · saved)</small></h2>${rows||'<span class="mu">No months entered yet.</span>'}${rows?row("Year total",fm(ti)+" · "+fm(te)+" · "+fm(ts)):""}</div>`}
function migrate(){delete S.mk;delete S.adj;delete S.mtd;S.loans.forEach(l=>{l.id??=uid();if(l.bal0===undefined){l.bal0=l.out;l.r=l.rate;l.from=l.from||cur}});const old={};S.cards.forEach((c,i)=>{if(!c.id){c.id=uid();old[i]=c.id}});S.inv.forEach(z=>{z.id??=uid()});
for(const k in S.bills){const b=S.bills[k];for(const i in old)if(b[i]){b[old[i]]=b[i];delete b[i]}}
for(const k in S.m){const x=S.m[k];if(!x.inc&&(x.s||x.o)){x.inc=[];if(x.s)x.inc.push({n:"Salary",a:x.s});if(x.o)x.inc.push({n:"Other income",a:x.o});delete x.s;delete x.o}}}
async function boot(){sel();render();let local=null;try{local=JSON.parse(localStorage.getItem("mt")||"null")}catch(e){}
try{const to=new Promise((_,r)=>setTimeout(r,10000)),p=(async()=>{const u=await claude.use("user"),db=await claude.use("db");if(!u||!db)return;const id=await u.id();if(!id)return;ref=db.collection("data/users/"+id).doc("ledger");const s=await ref.get();if(s.exists){local=JSON.parse(s.data().s)}})();await Promise.race([p,to])}catch(e){}
if(local)S=Object.assign(S,local);migrate();await login();if(!S.b.length)S.b=CATS.map(()=>"");$("#st").textContent=KEY?(sm||"Google Sheet sync is on"):ref?"Synced to your account":"Saved on this device only (sync is locked)";render()}
boot();
