<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Money Tracker</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1b2438;--mu:#6b7488;--ac:#2f5bea;--ok:#12805c;--bad:#c0392b;--wn:#b7791f;--bd:#e3e6ef;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1420;--card:#192033;--tx:#e8ecf5;--mu:#9aa5bd;--ac:#7c9bff;--ok:#4cc79a;--bad:#ff7b6b;--wn:#f0b44c;--bd:#2a3350;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1420;--card:#192033;--tx:#e8ecf5;--mu:#9aa5bd;--ac:#7c9bff;--ok:#4cc79a;--bad:#ff7b6b;--wn:#f0b44c;--bd:#2a3350;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 -apple-system,"Segoe UI",Roboto,Arial,sans-serif}
header{padding:16px 16px 8px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
h1{font-size:20px;margin:0}small,.mu{color:var(--mu)}
nav{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);display:flex;gap:6px;padding:8px 12px;overflow-x:auto;z-index:5}
nav button{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 14px;border-radius:20px;font:inherit;white-space:nowrap;cursor:pointer}
nav button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
main{padding:8px 12px 40px;max-width:900px;margin:0 auto}
.c{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.c h2{font-size:15px;margin:0 0 10px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.k{background:var(--bg);border-radius:10px;padding:10px}.k b{display:block;font-size:18px}
.r{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--bd)}
.r:last-child{border:0}
label{display:block;font-size:12px;color:var(--mu);margin-bottom:2px}
input,select{width:100%;padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;background:var(--ok)}
.pos{color:var(--ok)}.neg{color:var(--bad)}.wn{color:var(--wn)}
.b{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:9px 14px;font:inherit;cursor:pointer}
.x{background:none;border:0;color:var(--bad);cursor:pointer;font-size:18px}
#st{font-size:12px;color:var(--mu)}td,th{padding:5px 4px;text-align:right;border-bottom:1px solid var(--bd)}th:first-child,td:first-child{text-align:left}
</style></head><body>
<header><div><h1>💰 Money Tracker</h1><small>Private to you. Amounts in ₹.</small></div>
<div style="display:flex;gap:6px;align-items:end"><button class="b" onclick="mv(-1)">◀</button><div><label>Month</label><select id="ms"></select></div><div><label>Year</label><select id="ys"></select></div><button class="b" onclick="mv(1)">▶</button></div></header>
<nav id="nav"></nav><main id="v"></main>
<main><span id="st">Loading…</span> &nbsp;<button class="b" onclick="exp()">Export backup</button> <label class="b" style="display:inline-block;width:auto;cursor:pointer">Import backup<input type="file" accept=".json" style="display:none" onchange="imp(this)"></label></main>
<script>
const CATS=["Rent / housing","Groceries","Utilities & bills","Transport / fuel","Dining & shopping","Health & insurance","School fees / education","Subscriptions","Other"];
const INV=["FD","RD","Mutual Fund","Stock","PPF","EPF","NPS","Gold"];
const TABS={home:"Overview",month:"This month",budget:"Budget",cards:"Credit cards",wealth:"Investments",loans:"Loans",gold:"Gold, silver & property",bank:"Bank accounts",events:"Events",sync:"Google Sheet"};
let S={m:{},b:[],cb:0,cards:[],bills:{},inv:[],loans:[],gold:[],prop:[],gr:"",sr:"",ll:{},banks:[],bk:{},events:[]},cur=new Date().toISOString().slice(0,7),tab="home",ref=null,tm;
const $=q=>document.querySelector(q),num=v=>parseFloat(v)||0;
const fm=n=>(n<0?"-":"")+"₹"+Math.abs(Math.round(n||0)).toLocaleString("en-IN");
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function node(p){let t,r;const a=p.split(".");if(a[0]=="m"){t=S.m[cur]??={};r=a.slice(1)}else if(a[0]=="bill"){t=S.bills[cur]??={};r=a.slice(1)}else{t=S;r=a}
return{t,r}}
function get(p){let{t,r}=node(p);for(const k of r){if(t==null)return"";t=t[k]}return t??""}
function put(p,v){let{t,r}=node(p);r.forEach((k,i)=>{if(i==r.length-1)t[k]=v;else t=t[k]??=(isNaN(r[i+1])?{}:[])})}
function mt(k){const x=S.m[k]||{},e=CATS.reduce((a,c,i)=>a+num((x.e||[])[i]),0),inc=(x.inc||[]).reduce((a,r)=>a+num(r.a),0),emi=S.loans.reduce((a,l)=>{const o=lrow(l,k);return a+(o?o.emi+o.x:0)},0),inv=S.inv.reduce((a,z)=>a+invAmt(x,z,k),0),cc=S.cards.reduce((a,c)=>a+num((x.cs||{})[c.id]),0);
const ce=e+cc;return{inc,e:ce,cat:e,emi,inv,cc,sur:inc-ce-emi-inv,saved:inc-ce-emi,rate:inc?(inc-ce-emi)/inc:0}}
function nxt(d){const n=new Date(),t0=new Date(n.getFullYear(),n.getMonth(),n.getDate());let t=new Date(n.getFullYear(),n.getMonth(),d);if(t<t0)t=new Date(n.getFullYear(),n.getMonth()+1,d);return{t,days:Math.round((t-t0)/864e5)}}
const dt=t=>t.toLocaleDateString("en-IN",{day:"numeric",month:"short"});
function inp(p,l,type="number",ph="0"){return`<div><label>${l}</label><input data-p="${p}" type="${type}" inputmode="${type=="number"?"decimal":"text"}" placeholder="${ph}" value="${esc(get(p))}"></div>`}
const row=(a,b,c="")=>`<div class="r"><span>${a}</span><b class="${c}">${b}</b></div>`;
function save(){clearTimeout(tm);$("#st").textContent="Saving…";tm=setTimeout(async()=>{S._t=Date.now();const j=JSON.stringify(S);try{localStorage.setItem("mt",j)}catch(e){}
try{if(ref){await ref.set({s:j});$("#st").textContent="Saved to your account"}else $("#st").textContent="Saved on this device only"}catch(e){$("#st").textContent="Saved on this device only"}if(KEY)await push()},600)}
function incBlock(){const r=(S.m[cur]||{}).inc||[],ns=[...new Set(Object.values(S.m).flatMap(x=>(x.inc||[]).map(i=>i.n)).filter(Boolean))];
return`<div class="c"><h2>Income by family member</h2><datalist id="nm">${ns.map(n=>`<option value="${esc(n)}">`).join("")}</datalist>${r.map((x,i)=>`<div class="f" style="align-items:end;margin-bottom:8px"><div><label>Who / source</label><input list="nm" data-p="m.inc.${i}.n" value="${esc(x.n)}" placeholder="e.g. Vivek salary"></div>${inp("m.inc."+i+".a","Amount")}<div><button class="x" onclick="delInc(${i})">× Remove</button></div></div>`).join("")||'<p class="mu">No income yet. Add each earner below.</p>'}<button class="b" onclick="addInc()">+ Add earner</button></div>`}
function spendBlock(){const none=t=>`<p class="mu">${t}</p>`;
return`<div class="c"><h2>Credit card spends, by card (added to expenses)</h2><div class="f">${S.cards.map(c=>inp("m.cs."+c.id,esc(c.name))).join("")||none("Add a card in the Credit cards tab first.")}</div></div><div class="c"><h2>Invested this month, by account (SIPs fill in automatically)</h2><div class="f">${invRows()}</div></div>`}
function goldVal(){return S.gold.reduce((a,x)=>a+gv1(x),0)}
function gv1(x){const k=num(x.k)||24;return k>100?num(x.g)*k/999*num(S.sr):num(x.g)*k/24*num(S.gr)}
const pl=x=>{const k=num(x.k)||24;return k>100?"Silver "+k:k+"K"};
const bar1=(n,a,b)=>{const p=b?Math.min(100,a/b*100):0,o=a>b&&b;return`<div class="r" style="display:block"><div style="display:flex;justify-content:space-between"><span>${n}</span><b class="${o?"neg":""}">${fm(a)} / ${fm(b)}</b></div><div class="bar"><i style="width:${p}%;background:${o?"var(--bad)":"var(--ok)"}"></i></div></div>`};
const pmt=(P,i,k)=>k<=0?P:(i?P*i/(1-Math.pow(1+i,-k)):P/k);
function invRows(){const x=S.m[cur]||{},sh=x.sh||[];if(!S.inv.length)return'<p class="mu">Add investments in the Investments tab first.</p>';
const shown=S.inv.filter(z=>(z.mode=="Monthly SIP"&&(!z.sm||cur>=z.sm))||num((x.iv||{})[z.id])!=0||sh.includes(z.id)),rest=S.inv.filter(z=>!shown.includes(z));
return shown.map(z=>inp("m.iv."+z.id,esc(z.t+" · "+z.name),"number",z.mode=="Monthly SIP"?num(z.sip):"0")).join("")+(rest.length?`<div><label>Other investment this month</label><select id="addiv" onchange="showInv()"><option value="">+ Add another…</option>${rest.map(z=>`<option value="${z.id}">${esc(z.t+" · "+z.name)}</option>`).join("")}</select></div>`:"")}
function showInv(){const id=v("addiv");if(!id)return;const m=S.m[cur]??={};(m.sh??=[]).push(id);save();render()}
function dyeHtml(a,r,y,io){const i=r/1200,n=Math.round(y*12);if(!a||n<=io||io<0)return'<p class="mu">Check the amount, tenure and interest-only months.</p>';
const reg=pmt(a,i,n),ip=a*i,post=pmt(a,i,n-io),totD=ip*io+post*(n-io),totR=reg*n;
return`<div class="g" style="margin:8px 0"><div class="k">Interest-only payment<b>${fm(ip)}</b><small>for ${io} months</small></div><div class="k">EMI after that<b>${fm(post)}</b><small>for ${n-io} months</small></div><div class="k">Regular EMI, no plan<b>${fm(reg)}</b></div></div>`+row("Total interest with Design Your EMI",fm(totD-a))+row("Total interest with a regular EMI",fm(totR-a))+row("Extra interest from the plan",fm(totD-totR),"neg")+row("EMI increase after interest-only period",fm(post-reg))}
function dye(){const mx=v("dt")=="U"?48:12;$("#dyo").innerHTML=dyeHtml(num(v("da")),num(v("dr")),num(v("dy")),Math.min(num(v("dm")),mx))}
function fillLoan(){const mx=v("dt")=="U"?48:12;$("#ln").value="Home loan";$("#lb").value="Godrej Housing Finance";$("#lp").value=$("#lo").value=v("da");$("#lr").value=v("dr");$("#ltn").value=Math.round(num(v("dy"))*12);$("#lio").value=Math.min(num(v("dm")),mx);$("#le").value="";$("#ln").scrollIntoView({behavior:"smooth"})}
function dyeCard(){return`<div class="c"><h2>Design Your EMI calculator (Godrej Housing Finance)</h2><div class="f"><div><label>Loan amount (₹)</label><input id="da" type="number" value="8000000" oninput="dye()"></div><div><label>Interest rate % (use your sanctioned rate)</label><input id="dr" type="number" step="0.01" value="7.65" oninput="dye()"></div><div><label>Tenure (years)</label><input id="dy" type="number" value="20" oninput="dye()"></div><div><label>Property</label><select id="dt" onchange="dye()"><option value="R">Ready to move in (up to 12 months)</option><option value="U">Under construction (up to 48 months)</option></select></div><div><label>Interest-only months</label><input id="dm" type="number" value="12" oninput="dye()"></div></div><div id="dyo">${dyeHtml(8000000,7.65,20,12)}</div><p><button class="b" onclick="fillLoan()">Use these details for my home loan</button></p><small class="mu">Based on Godrej Housing Finance’s published terms: interest-only payments for up to 12 months on ready homes and up to 48 months on under-construction homes, with 7.65% as the advertised starting rate. Your actual rate is confirmed at sanction, and the interest amount you can choose in the flexible period sits within limits Godrej sets, so check your sanction letter. After the interest-only period the EMI is recalculated over the remaining tenure.</small></div>`}
const ym=k=>{const[a,b]=k.split("-").map(Number);return a*12+b-1},ymk=n=>Math.floor(n/12)+"-"+String(n%12+1).padStart(2,"0");
function lrow(l,k){const f=l.from||cur;if(ym(k)<ym(f))return null;const lg=(S.ll||{})[l.id]||{};let bal=num(l.bal0),r=num(l.r),emi=num(l.emi),o=null;const io=num(l.io),N=num(l.n);let fixed=emi>0&&!(io>0);
for(let n=ym(f);n<=ym(k);n++){const g=lg[ymk(n)]||{};if(g.r!==undefined&&g.r!=="")r=num(g.r);const t=n-ym(f),given=g.emi!==undefined&&g.emi!=="";if(given){emi=num(g.emi);if(t>=io)fixed=true}const i=bal*r/1200,x=num(g.x),b0=bal;let pay=t<io?(given?emi:i):(fixed?emi:(N?pmt(bal,r/1200,N-t):emi));const p=Math.min(bal,Math.max(0,pay-i));bal=Math.max(0,bal-p-x);if(g.b!==undefined&&g.b!=="")bal=num(g.b);o={r,emi:Math.min(pay,b0+i),i,p,x,bal}}return o}
function outs(l,k){const o=lrow(l,k);return o?o.bal:num(l.bal0)}
function ltBody(){const t=S.loans.reduce((a,l)=>{const o=lrow(l,cur);return[a[0]+(o?o.bal:num(l.bal0)),a[1]+(o?o.emi+o.x:0),a[2]+(o?o.i:0)]},[0,0,0]);return`<h2>${MN[+cur.slice(5)-1]} ${cur.slice(0,4)}, all loans</h2><div class="g"><div class="k">Outstanding at month end<b>${fm(t[0])}</b></div><div class="k">EMIs paid this month<b>${fm(t[1])}</b></div><div class="k">Interest this month<b>${fm(t[2])}</b></div></div>`}
function lcBody(l){const io=num(l.io),N=num(l.n),o=lrow(l,cur),bal=o?o.bal:num(l.bal0),r=o?o.r:num(l.r),emi=o?o.emi:num(l.emi),pct=num(l.p)?Math.max(0,Math.min(100,(1-bal/num(l.p))*100)):0,rr=r/1200;let end="",rows="";
if(bal<=0)end="Fully repaid.";else if(N){const t0=ym(cur)-ym(l.from||cur),t2=ymk(ym(l.from||cur)+N-1);end=(t0<io?"Interest-only for "+(io-t0)+" more month(s) including this one, then EMI about "+fm(pmt(bal,rr,N-io))+". ":"")+"Scheduled to clear around "+MN[+t2.slice(5)-1]+" "+t2.slice(0,4)+"."}else if(emi>bal*rr){const n=Math.ceil(rr?-Math.log(1-bal*rr/emi)/Math.log(1+rr):bal/emi),t=ymk(ym(cur)+n);end="At this rate and EMI the loan clears around "+MN[+t.slice(5)-1]+" "+t.slice(0,4)+"."}else end="The EMI does not cover the monthly interest.";
if(o)for(let n=Math.max(ym(l.from||cur),ym(cur)-11);n<=ym(cur);n++){const q=lrow(l,ymk(n));rows+=`<tr><td>${MN[n%12]} ${String(Math.floor(n/12)).slice(2)}</td><td>${q.r}%</td><td>${fm(q.emi+q.x)}</td><td>${fm(q.i)}</td><td>${fm(q.p+q.x)}</td><td><b>${fm(q.bal)}</b></td></tr>`}
return`<div class="g" style="margin:8px 0"><div class="k">Outstanding<b>${fm(bal)}</b></div><div class="k">Rate<b>${r}%</b></div><div class="k">EMI<b>${fm(emi)}</b></div><div class="k">Repaid<b>${num(l.p)?Math.round(pct)+"%":"n/a"}</b></div></div><div class="bar"><i style="width:${pct}%"></i></div><small>${end}</small>${o?`<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:13px;margin-top:8px"><tr class="mu"><th>Month</th><th>Rate</th><th>Paid</th><th>Interest</th><th>Principal</th><th>Balance</th></tr>${rows}</table></div>`:'<p class="mu">Tracking for this loan starts in '+esc(l.from)+'.</p>'}`}
function loanCard(l,i){const p="ll."+l.id+"."+cur+".",o=lrow(l,cur),nx=l.day?nxt(num(l.day)):null;
return`<div class="c"><div class="r"><b>🏠 ${esc(l.name)}</b><span><button class="x" style="color:var(--ac)" onclick="editItem('loans',${i})">✎</button><button class="x" onclick="del('loans',${i})">×</button></span></div><small>${esc(l.lender||"")}${nx?" · next EMI "+dt(nx.t)+" ("+nx.days+" days)":""}</small><div id="lc${i}">${lcBody(l)}</div><h2 style="margin-top:12px">Update for ${cur} <small>(fill only what changed; a new rate or EMI carries forward)</small></h2><div class="f">${inp(p+"r","Interest rate % this month","number",o?o.r:"")}${inp(p+"emi","EMI paid (₹)","number",o?o.emi:"")}${inp(p+"x","Extra / part-payment (₹)")}${inp(p+"b","Balance per bank statement (₹)")}</div><h2 style="margin-top:12px">Prepayment calculator</h2><div class="f"><div><label>Lump-sum prepayment (₹)</label><input type="number" id="pp${i}" placeholder="e.g. 500000" oninput="pp(${i})"></div></div><div id="pr${i}" style="margin-top:8px">${ppHtml(l,0)}</div><small class="mu">Based on the outstanding balance at the end of ${cur}. To record a prepayment you actually made, enter it above as “Extra / part-payment” for that month.</small></div>`}
let nvm="";
async function refreshNav(){const L=S.inv.filter(x=>x.code&&num(x.units));if(!L.length){nvm="Add a scheme code and units to a mutual fund first.";render();return}nvm="Fetching…";render();let ok=0;
await Promise.all(L.map(async x=>{try{const r=await fetch("https://api.mfapi.in/mf/"+x.code+"/latest"),j=await r.json(),d=j.data&&j.data[0];if(d){x.nav=num(d.nav);x.navd=d.date;x.val=String(Math.round(num(x.units)*x.nav));ok++}}catch(e){}}));
nvm=ok+" of "+L.length+" updated";save();render()}
async function mfSearch(){const q=v("mq");if(!q)return;try{const r=await fetch("https://api.mfapi.in/mf/search?q="+encodeURIComponent(q)),j=await r.json();$("#msr").innerHTML='<option value="">Pick a scheme…</option>'+j.slice(0,25).map(s=>`<option value="${s.schemeCode}">${esc(s.schemeName)}</option>`).join("")}catch(e){$("#msr").innerHTML='<option value="">Search unavailable</option>'}}
function mfPick(){const c=v("msr");if(c){$("#mc").value=c;if(!v("in"))$("#in").value=$("#msr").selectedOptions[0].text}}
function ppHtml(l,P){const o=lrow(l,cur);if(!o||!P)return'<p class="mu">Enter an amount to see what a prepayment does.</p>';
const bal=o.bal,rr=o.r/1200,io=num(l.io),N=num(l.n),t0=ym(cur)-ym(l.from||cur);if(bal<=0)return'<p class="mu">This loan is already repaid.</p>';
let nR,emi;if(N){nR=N-Math.max(io,t0+1);if(nR<=0)return'<p class="mu">Almost at the end of the tenure.</p>';emi=pmt(bal,rr,nR)}else{emi=o.emi;if(emi<=bal*rr)return'<p class="mu">The EMI does not cover the interest, so a prepayment cannot be modelled.</p>';nR=rr?-Math.log(1-bal*rr/emi)/Math.log(1+rr):bal/emi}
const nb=Math.max(0,bal-P),base=emi*nR-bal;let n2=0;if(nb>0)n2=rr?-Math.log(1-nb*rr/emi)/Math.log(1+rr):nb/emi;
const eB=pmt(nb,rr,nR),sA=base-(emi*n2-nb),sB=base-(eB*nR-nb);
return`<div class="g"><div class="k">Option 1: keep the EMI of ${fm(emi)}<b>${Math.max(0,Math.round(nR-n2))} months sooner</b><small>saves ${fm(sA)} interest</small></div><div class="k">Option 2: keep the tenure<b>EMI falls to ${fm(eB)}</b><small>saves ${fm(sB)} interest</small></div></div>`}
function pp(i){$("#pr"+i).innerHTML=ppHtml(S.loans[i],num(v("pp"+i)))}
function brow(b,k){const f=b.from||cur;if(ym(k)<ym(f))return null;const lg=(S.bk||{})[b.id]||{};let open=num(b.op),o=null;
for(let n=ym(f);n<=ym(k);n++){const g=lg[ymk(n)]||{},i=num(g.i),u=num(g.o),exp=open+i-u,act=g.c!==undefined&&g.c!==""?num(g.c):null;o={open,i,out:u,exp,act,diff:act===null?null:act-exp,ok:!!g.ok};open=act!==null?act:exp}return o}
function bankTot(k){return S.banks.reduce((a,b)=>{const o=brow(b,k);return a+(o?(o.act!==null?o.act:o.exp):num(b.op))},0)}
function btBody(){let tot=0,n=0,okc=0,diff=0,cin=0;S.banks.forEach(b=>{const o=brow(b,cur);if(!o){tot+=num(b.op);return}tot+=o.act!==null?o.act:o.exp;n++;if(o.ok||(o.act!==null&&Math.abs(o.diff)<0.5))okc++;if(o.diff)diff+=o.diff;cin+=o.i});const t=mt(cur);
return`<h2>${MN[+cur.slice(5)-1]} ${cur.slice(0,4)}, all accounts</h2><div class="g"><div class="k">Total balance<b>${fm(tot)}</b></div><div class="k">Accounts reconciled<b>${okc} of ${n}</b></div><div class="k">Unexplained difference<b class="${Math.abs(diff)>=0.5?"neg":"pos"}">${fm(diff)}</b></div></div>`+row("Income logged on Monthly",fm(t.inc))+row("Money in entered across accounts",fm(cin))+'<small class="mu">Credits can include transfers between your own accounts and refunds, so these two may differ.</small>'}

try{const to=new Promise((_,r)=>setTimeout(r,10000)),p=(async()=>{const u=await claude.use("user"),db=await claude.use("db");if(!u||!db)return;const id=await u.id();if(!id)return;ref=db.collection("data/users/"+id).doc("ledger");const s=await ref.get();if(s.exists){local=JSON.parse(s.data().s)}})();await Promise.race([p,to])}catch(e){}
if(local)S=Object.assign(S,local);migrate();await unlock();if(!S.b.length)S.b=CATS.map(()=>"");$("#st").textContent=KEY?(sm||"Google Sheet sync is on"):ref?"Synced to your account":"Saved on this device only (sync is locked)";render()}
